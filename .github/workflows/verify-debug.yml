name: Verify debug build

on:
  push:
    branches: [ feature/subscription-model-entry ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37"
      - run: chmod +x gradlew && ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
